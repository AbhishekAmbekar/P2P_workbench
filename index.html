<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Each file link carries ?v=N. Raise N by one in every pull request that changes any css or js file,
     so browsers fetch the new files right away instead of using an old saved copy for up to 10 minutes. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Workbench</title>
<link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>P2P Workbench</h1>
    <p>Request to pay, from PR to invoice</p>
  </div>
  <button type="button" id="searchBtn" class="searchbox" aria-label="Search records, suppliers or screens" aria-keyshortcuts="Control+K Meta+K /"></button>
  <div class="who">
    <span class="wholbl" id="roleLbl">Working as</span>
    <select id="roleSel" class="vh" tabindex="-1" aria-hidden="true"></select>
    <div class="rolepick" id="rolePick"></div>
    <button id="resetBtn" class="ghost" title="Restore the demo data">Reset demo</button>
  </div>
</header>
<div class="shell">
<nav id="tabs" class="tabs" aria-label="Sections"></nav>
<main id="view"></main>
</div>
<footer class="foot">Demo with fictional data. Not based on any real company's process, prices or suppliers.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js?v=21"></script>
<script src="js/logic.js?v=21"></script>
<script src="js/csv.js?v=21"></script>
<script src="js/search.js?v=21"></script>
<script src="js/seed.js?v=21"></script>
<script src="js/app.js?v=21"></script>
<script src="js/csv-ui.js?v=21"></script>
<script src="js/search-ui.js?v=21"></script>
<script src="js/charts.js?v=21"></script>
<script src="js/view-dashboard.js?v=21"></script>
<script src="js/view-requests.js?v=21"></script>
<script src="js/view-rfx.js?v=21"></script>
<script src="js/view-contracts.js?v=21"></script>
<script src="js/view-pos.js?v=21"></script>
<script src="js/view-expedite.js?v=21"></script>
<script src="js/view-grn.js?v=21"></script>
<script src="js/view-services.js?v=21"></script>
<script src="js/view-invoices.js?v=21"></script>
<script src="js/view-suppliers.js?v=21"></script>
<script src="js/view-audit.js?v=21"></script>
<script src="js/view-guide.js?v=21"></script>
<script src="js/view-record.js?v=21"></script>
<script>App.start();</script>
</body>
</html>
